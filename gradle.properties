# 🚀 Gradle Execution Optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true

# 🧠 JVM Memory Limits (Optimal for performance)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ⚡ Kotlin Compiler Optimizations
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.caching.enabled=true

# 🛠️ Fix for Kotlin Daemon Connection Failures
# Using 'in-process' strategy to bypass the faulty daemon socket connection overhead
kotlin.compiler.execution.strategy=in-process

# 📱 Kotlin Multiplatform Specifics
# Suppress missing targets (like iOS on Linux) to prevent build evaluation errors
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.stability.nowarn=true

# 📄 Dokka V2 Plugin Mode (required for Dokka 2.0.0+)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# 🔐 Required env vars for publishing (set these in your shell / CI, not here):
# ORG_GRADLE_PROJECT_mavenCentralUsername = Sonatype Central Portal user token username
# ORG_GRADLE_PROJECT_mavenCentralPassword = Sonatype Central Portal user token password
# GPG_SIGNING_KEY = armored private PGP key
# GPG_SIGNING_PASSWORD = passphrase for the PGP key
# NPM_TOKEN = npm auth token
