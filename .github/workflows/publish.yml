name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish Library to Maven Central
        run: |
          ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache --parallel --stacktrace \
            -PmavenCentralUsername="${{ secrets.MAVEN_CENTRAL_USERNAME }}" \
            -PmavenCentralPassword="${{ secrets.MAVEN_CENTRAL_PASSWORD }}" \
            -Psigning.keyId="${{ secrets.GPG_SIGNING_KEY_ID }}" \
            -Psigning.password="${{ secrets.GPG_SIGNING_PASSWORD }}" \
            -Psigning.key="${{ secrets.GPG_SIGNING_KEY }}" \
            -Psigning.secretKey="${{ secrets.GPG_SIGNING_KEY }}"
